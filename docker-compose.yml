services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TaskM@nager2024!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TaskM@nager2024!" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: TaskManager.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TaskManagerDB;User=sa;Password=TaskM@nager2024!;TrustServerCertificate=true
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/task-manager-app
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqldata:
